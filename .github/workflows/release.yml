name: release
on:
  push:
    tags:
      - v*
  # A dispatch run builds and uploads every artifact without publishing, so a
  # change to this workflow can be checked with a real run before a tag does it.
  # `skip_release` defaults to true and only means something together with a tag
  # ref; a branch ref never publishes.
  workflow_dispatch:
    inputs:
      skip_release:
        description: Build the release artifacts and keep them in the run instead of publishing them
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  check_version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/wu/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/wu/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Check that the changelog has entries for this version
        if: github.event_name == 'push'
        run: script/changelog-section "${GITHUB_REF_NAME#v}" >/dev/null

  # B2b: every bundle used to `cargo install cargo-about` itself (2-3.7 minutes)
  # before it could generate licenses.md. Compile it once per platform here and
  # let the bundles restore it from the cache. Generating licenses.md stays in
  # each bundle: whether its content is identical across platforms (B2a) is not
  # settled yet.
  cargo_about:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: ubuntu-22.04
          - runner: ubuntu-22.04-arm
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install cargo-about
        shell: bash
        run: script/generate-licenses --install-only
      # A cache miss in a bundle puts that job back where it was before this job
      # existed (generate-licenses installs cargo-about itself), so failing to
      # save here costs time, not the release.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about*
          key: cargo-about-${{ hashFiles('script/generate-licenses') }}-${{ runner.os }}-${{ runner.arch }}

  bundle_mac:
    needs: [check_version, cargo_about]
    # cargo-about is only a speedup: if its job fails or never gets a runner, the
    # bundle still has to run, because `generate-licenses` installs cargo-about
    # itself on a cache miss. Gating on check_version alone keeps a broken tag or
    # changelog from starting the builds.
    if: ${{ !cancelled() && needs.check_version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    # Intel builds are cross-compiled on the Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 300
    env:
      # Three jobs keeps the release build inside the runner's memory while
      # still using most of its cores.
      CARGO_BUILD_JOBS: "3"
      # The `remote_server` job builds the server this bundle used to build.
      WU_SKIP_REMOTE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # 实验装置（待验证后启用）：先在 macos-dmg.yml 里用 workflow_dispatch 跑一次
      # 看命中率，再打开这里。两个 arch 的图例各自一份缓存。注意 caches 7 天不用
      # 就会被清掉，月更的 release 很可能永远命中不了。
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: ${{ matrix.arch }}
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      # With MACOS_CERTIFICATE alone the bundle is signed but not notarized.
      # Without it the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Restore the prebuilt cargo-about
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about*
          key: cargo-about-${{ hashFiles('script/generate-licenses') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - name: Check that every string and command has its Chinese text
        if: matrix.arch == 'aarch64'
        run: script/check-translations --binary target/aarch64-apple-darwin/release/IDE
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.arch }}-apple-darwin/release/IDE-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dsym
          path: target/${{ matrix.arch }}-apple-darwin/release/IDE.dSYM.zip
          if-no-files-found: error

  bundle_linux:
    needs: [check_version, cargo_about]
    # See bundle_mac: a cargo-about failure costs the cache, not the bundle.
    if: ${{ !cancelled() && needs.check_version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
      CARGO_BUILD_JOBS: "4"
      # The `remote_server` job builds the server this bundle used to build.
      WU_SKIP_REMOTE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      # The release profile builds with `lto = "thin"` and `codegen-units = 1`,
      # which peaks far above the runner's memory: without this the bundling job
      # gets killed with exit code 143 or drops the runner connection entirely.
      - name: Reclaim disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      - name: Restore the prebuilt cargo-about
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about*
          key: cargo-about-${{ hashFiles('script/generate-licenses') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Bundle
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/ide-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  bundle_windows:
    needs: [check_version, cargo_about]
    # See bundle_mac: a cargo-about failure costs the cache, not the bundle.
    if: ${{ !cancelled() && needs.check_version.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # The `remote_server` job builds the server this bundle used to build.
      WU_SKIP_REMOTE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Restore the prebuilt cargo-about
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about*
          key: cargo-about-${{ hashFiles('script/generate-licenses') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/IDE-x86_64.exe
          if-no-files-found: error

  # Each bundle used to compile the remote server serially after the editor: on
  # macOS and Linux under a feature set nothing else used, which recompiled part
  # of the graph, and on Windows with 191 crates recompiled. Building it in a job
  # of its own puts that work next to the editor builds instead of behind them,
  # and every platform still runs the exact commands its bundle script used.
  remote_server:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - os: macos
            arch: x86_64
            runner: macos-15
            target: x86_64-apple-darwin
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: windows
            arch: x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      WU_REMOTE_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        if: matrix.os == 'macos'
        run: brew install lld
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: ./script/linux
      - name: Use the stable release channel
        if: matrix.os != 'windows'
        run: echo stable > crates/wu/RELEASE_CHANNEL
      - name: Use the stable release channel
        if: matrix.os == 'windows'
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Build
        if: matrix.os == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.target }}
      - name: Build
        if: matrix.os == 'linux'
        run: ./script/bundle-linux
      - name: Build
        if: matrix.os == 'windows'
        run: script/bundle-windows.ps1 -Architecture ${{ matrix.arch }}
        shell: pwsh
      # The file name inside the artifact is the asset name the client asks for,
      # and it sorts under the os/arch the bundle jobs used to upload it under.
      - uses: actions/upload-artifact@v4
        with:
          name: remote-server-${{ matrix.os }}-${{ matrix.arch }}
          path: target/wu-remote-server-${{ matrix.os }}-${{ matrix.arch }}.gz
          if-no-files-found: error

  release:
    needs: [bundle_mac, bundle_linux, bundle_windows, remote_server]
    # Every job that uploads an asset gates the release. Publishing while one of
    # them failed ships a release that silently misses that asset, which is worse
    # than no release at all, so keep this list in sync with the upload steps
    # above. `always()` makes the job evaluate this instead of being skipped
    # because a dependency failed, so the run still reports the failure.
    if: always() && needs.bundle_mac.result == 'success' && needs.bundle_linux.result == 'success' && needs.bundle_windows.result == 'success' && needs.remote_server.result == 'success'
    runs-on: ubuntu-24.04
    # Only the publishing job needs to write; the build jobs above it run
    # third-party code and must not hold a token that can create releases.
    permissions:
      contents: write
    env:
      # A `workflow_dispatch` run is a dry run: `skip_release` defaults to true,
      # and even with it off the job publishes only from a tag ref, so building a
      # branch can never create a release or a tag.
      PUBLISH: ${{ (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')) && inputs.skip_release != true }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags for the changelog link
        run: git fetch --quiet --tags --force --depth=1 origin
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep debug symbols out of the release assets
        run: find artifacts -name '*.dSYM.zip' -delete
      - name: List the assets that would be published
        run: find artifacts -type f -printf '%10s  %p\n' | sort -k2
      - name: Write the release body
        if: env.PUBLISH == 'true'
        run: |
          {
            cat .github/release/body.md
            echo
            echo "## What's new"
            echo
            script/changelog-section "${GITHUB_REF_NAME#v}"
            previous=$(git tag --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | tail -n +2)
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-body.md
      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: WuIDE ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/**
