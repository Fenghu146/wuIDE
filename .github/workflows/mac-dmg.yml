name: macos-dmg

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  bundle_mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    # Intel builds are cross-compiled on the Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      - name: Bundle
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: target/${{ matrix.arch }}-apple-darwin/release/IDE-${{ matrix.arch }}.dmg
          if-no-files-found: error
      - name: Check that every string and command has its Chinese text
        run: script/check-translations --binary target/${{ matrix.arch }}-apple-darwin/release/IDE